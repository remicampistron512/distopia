<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>Formulaire Réservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<section layout:fragment="content">
  <div class="container mt-4">

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <h1 class="mb-4"
            th:text="${booking.id == null or booking.id == 0 ? 'Créer un cinéma' : 'Modifier le cinéma'}">
          Formulaire Reservation
        </h1>

        <form th:action="@{/bookings/save}"
              th:object="${booking}"
              method="post"
        >

          <input type="hidden" th:field="*{id}">

          <div class="mb-3">
            <label for="showingId" class="form-label">Sélectionnez la séance</label>
            <select id="showingId"
                    name="showingId"
                    class="form-select">

              <option value="">-- Sélectionner une seance cinéma --</option>

              <option th:each="showing : ${showings}"
                      th:value="${showing.id}"
                      th:text="${showing.movie.title} +  ${showing.cinema.name} "
                      th:selected="${booking.showing != null and booking.showing.id == showing.id}">
              </option>
            </select>
            <input type="hidden" name="userId" th:value="${session.loggedUser.id}" />
          </div>






          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              Enregistrer
            </button>

            <a th:href="@{/bookings/admin}" class="btn btn-outline-secondary">
              Annuler
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</section>

</body>
</html>
